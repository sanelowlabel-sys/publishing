<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180" fill="none">
  <!-- Official RISA Logo with Ultra-Clear High-Contrast Brand Mark -->
  <g transform="translate(10, 15)">
    <!-- R (bold rounded left corner, deep navy #080942) -->
    <path d="M12 108 L12 20 L78 20 C 104 20, 118 32, 118 52 C 118 68, 108 78, 92 82 L120 108 L84 108 L62 84 L40 84 L40 108 Z M40 62 L74 62 C 84 62, 90 58, 90 51 C 90 44, 84 40, 74 40 L40 40 Z" fill="#06083B" />

    <!-- i (lower letter with bright sky-blue square dot #0085CA) -->
    <!-- Dot of i: cyan/sky-blue square -->
    <rect x="135" y="20" width="34" height="24" rx="2" fill="#0085CA" />
    <!-- Stem of i -->
    <path d="M135 52 L169 52 L169 108 L135 108 Z" fill="#06083B" />

    <!-- S (bold geometric) -->
    <path d="M255 42 C 248 30, 235 20, 218 20 C 196 20, 180 32, 180 50 C 180 66, 196 74, 216 78 C 236 82, 246 88, 246 96 C 246 104, 236 108, 222 108 C 204 108, 190 98, 182 86 L154 98 C 166 118, 190 128, 222 128 C 254 128, 276 112, 276 90 C 276 72, 260 64, 240 60 C 220 56, 210 50, 210 42 C 210 34, 218 30, 228 30 C 240 30, 250 36, 258 44 Z" fill="#06083B" />

    <!-- A (bold slanted right) -->
    <path d="M336 20 L278 128 L314 128 L328 98 L374 98 L386 128 L422 128 L364 20 Z M340 72 L351 46 L362 72 Z" fill="#06083B" />

    <!-- Solid horizontal blue underline -->
    <line x1="10" y1="138" x2="425" y2="138" stroke="#0085CA" stroke-width="4.5" stroke-linecap="round" />

    <!-- Subtitle: representing the recording industry of south africa -->
    <text x="12" y="162" fill="#06083B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="0.4">representing the recording industry of south africa</text>
  </g>
</svg>
