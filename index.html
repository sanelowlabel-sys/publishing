    <script>
      // Defensive initialization for iframe sandboxes where window.fetch has only a getter
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (!desc || !desc.set) {
            var currentFetch = realFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (err) {
          // Fallback gracefully without breaking execution
        }
      })();
    </script>
